<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON NFT ARCADE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c0a14;
            --bg-card: #131022;
            --bg-panel: #1a1630;
            --neon-blue: #00f2fe;
            --neon-pink: #f857a6;
            --neon-green: #00ff87;
            --neon-gold: #ffb700;
            --text-muted: #575273;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--bg-main); color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; }

        /* Шапка */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; }
        .logo { font-weight: 800; font-size: 1.2rem; background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
        .balance-container { display: flex; align-items: center; gap: 12px; }
        .stat-badge { background: var(--bg-card); padding: 6px 12px; border-radius: 20px; font-weight: bold; border: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .stat-badge.ton { border-color: rgba(0, 242, 254, 0.3); color: var(--neon-blue); }
        .stat-badge.stars { border-color: rgba(255, 183, 0, 0.3); color: var(--neon-gold); }

        /* Навигация */
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
        .nav-btn { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.03); color: #8a85aa; padding: 10px 5px; border-radius: 12px; cursor: pointer; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; transition: all 0.2s; }
        .nav-btn.active { background: var(--bg-panel); color: #fff; border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }

        /* Экраны */
        .screen { display: none; flex-direction: column; flex-grow: 1; }
        .screen.active { display: flex; }

        /* Компоненты кейсов */
        .case-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .case-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
        .case-card.active { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(248, 87, 166, 0.2); }
        .case-card h3 { font-size: 1rem; margin-bottom: 5px; }
        .case-card .price { font-size: 0.85rem; color: var(--neon-blue); font-weight: bold; }
        .case-card .rarity-tag { font-size: 0.65rem; text-transform: uppercase; font-weight: 900; letter-spacing: 0.5px; opacity: 0.8; margin-top: 4px; display: inline-block; }

        .roulette-container { background: var(--bg-panel); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.03); position: relative; }
        .roulette-window { height: 110px; overflow: hidden; position: relative; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
        .roulette-track { display: flex; position: absolute; left: 0; top: 5px; height: 100px; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .roulette-item { width: 90px; height: 90px; margin: 5px; background: var(--bg-card); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.65rem; border: 2px solid #333; box-sizing: border-box; padding: 4px; text-align: center; }
        .roulette-item img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 4px; }
        .roulette-marker { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 120px; background: var(--neon-blue); z-index: 10; box-shadow: 0 0 10px var(--neon-blue); pointer-events: none; }

        .action-btn { background: linear-gradient(90deg, var(--neon-pink), #f857a6); border: none; color: #fff; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(248, 87, 166, 0.3); width: 100%; margin-bottom: 10px; }
        .action-btn:active { transform: scale(0.98); opacity: 0.9; }
        .action-btn:disabled { background: #2a2640; color: #575273; box-shadow: none; cursor: not-allowed; }

        /* Инвентарь и крафт */
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; overflow-y: auto; max-height: 40vh; padding: 4px; }
        .inventory-item { background: var(--bg-card); border-radius: 12px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.6rem; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; position: relative; padding: 4px; text-align: center; }
        .inventory-item.selected { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0,255,135,0.3); }
        .inventory-item img { width: 35px; height: 35px; object-fit: contain; margin-bottom: 2px; }
        
        .craft-zone { background: var(--bg-panel); border-radius: 16px; padding: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.03); }
        .craft-slots-info { text-align: center; font-size: 0.85rem; margin-bottom: 8px; color: #8a85aa; }

        /* Апгрейд */
        .upgrade-box { background: var(--bg-panel); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.03); }
        .ring-display { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; }
        .ring-slot { width: 90px; height: 90px; background: var(--bg-card); border: 2px dashed #3a3655; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; color: var(--text-muted); padding: 4px; text-align: center; }
        .ring-slot img { width: 50px; height: 50px; object-fit: contain; }
        .upgrade-chance-badge { background: rgba(0, 255, 135, 0.1); color: var(--neon-green); padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 10px; border: 1px solid rgba(0,255,135,0.15); }

        /* Донат */
        .deposit-box { background: var(--bg-panel); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.03); margin-bottom: 15px; }
        .deposit-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .currency-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 10px; }
        .toggle-btn { background: transparent; border: none; color: #8a85aa; padding: 8px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .toggle-btn.active.ton { background: var(--bg-card); color: var(--neon-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .toggle-btn.active.stars { background: var(--bg-card); color: var(--neon-gold); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .slider-container { margin-bottom: 25px; }
        .slider-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: #8a85aa; margin-bottom: 8px; }
        .slider-value { font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 12px; }
        .slider-value span { font-size: 0.9rem; font-weight: normal; margin-left: 4px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: #2a2640; height: 6px; border-radius: 3px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--neon-blue); cursor: pointer; box-shadow: 0 0 8px var(--neon-blue); transition: background 0.1s; }
        input[type=range].stars::-webkit-slider-thumb { background: var(--neon-gold); box-shadow: 0 0 8px var(--neon-gold); }

        /* Админ панель */
        .admin-box { background: #221015; border: 1px solid #ff005533; border-radius: 16px; padding: 15px; margin-top: 20px; }
        .admin-box h3 { color: #ff0055; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; }
        .admin-input { width: 100%; background: #11080b; border: 1px solid #ff005533; border-radius: 8px; padding: 8px; color: #fff; font-size: 0.8rem; margin-bottom: 8px; outline: none; }
        .admin-btn { background: #ff0055; border: none; color: #fff; padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 6px; }

        /* Редкости цветов */
        .rare-common { color: #b0b0b0; text-shadow: 0 0 4px #b0b0b044; }
        .rare-rare { color: #00a2ff; text-shadow: 0 0 6px #00a2ff66; }
        .rare-epic { color: #b600ff; text-shadow: 0 0 8px #b600ff66; }
        .rare-legendary { color: #ff9a00; text-shadow: 0 0 10px #ff9a0077; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="logo">NFT Arcade</div>
        <div class="balance-container">
            <div class="stat-badge ton" id="balance-ton-display">0.00 TON</div>
            <div class="stat-badge stars" id="balance-stars-display">0 Stars</div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchScreen('cases')">Кейсы</button>
        <button class="nav-btn" onclick="switchScreen('inventory')">Инвентарь</button>
        <button class="nav-btn" onclick="switchScreen('upgrade')">Апгрейд</button>
        <button class="nav-btn" onclick="switchScreen('deposit')">Касса</button>
    </div>

    <div id="screen-cases" class="screen active">
        <div class="case-selector">
            <div class="case-card active" id="case-0" onclick="selectCase(0)">
                <h3>Common Case</h3>
                <div class="price">0.50 TON</div>
                <span class="rarity-tag rare-common">Обычный</span>
            </div>
            <div class="case-card" id="case-1" onclick="selectCase(1)">
                <h3>Epic Case</h3>
                <div class="price">2.00 TON</div>
                <span class="rarity-tag rare-epic">Эпический</span>
            </div>
        </div>

        <div class="roulette-container">
            <div class="roulette-marker"></div>
            <div class="roulette-window">
                <div class="roulette-track" id="roulette-track">
                    </div>
            </div>
        </div>

        <button class="action-btn" id="open-case-btn" onclick="openCaseRoutine()">ОТКРЫТЬ КЕЙС</button>
    </div>

    <div id="screen-inventory" class="screen">
        <div class="craft-zone">
            <div class="craft-slots-info" id="craft-slots-counter">Выбрано предметов для крафта: 0 / 5</div>
            <button class="action-btn" style="background: linear-gradient(90deg, var(--neon-green), #00d270); box-shadow: 0 4px 15px rgba(0,255,135,0.2); margin-bottom: 0;" id="craft-btn" onclick="craftRoutine()" disabled>СКРАФТИТЬ ПРЕДМЕТ</button>
        </div>
        <div class="grid-container" id="inventory-grid">
            </div>
    </div>

    <div id="screen-upgrade" class="screen">
        <div class="upgrade-box">
            <div class="upgrade-chance-badge" id="upgrade-chance-text">Шанс успеха: -- %</div>
            <div class="ring-display">
                <div class="ring-slot" id="upgrade-slot-source" onclick="removeSourceFromUpgrade()">
                    <span>Нажмите на предмет внизу</span>
                </div>
                <div style="font-size: 1.5rem; color: var(--neon-pink);">➜</div>
                <div class="ring-slot" id="upgrade-slot-target">
                    <img src="" id="ring-target-preview" style="display:none;">
                    <span id="ring-target-placeholder">???</span>
                </div>
            </div>
            <button class="action-btn" style="margin-bottom: 0;" id="upgrade-execute-btn" onclick="upgradeRoutine()" disabled>УЛУЧШИТЬ ПРЕДМЕТ</button>
        </div>
        <div class="grid-container" id="upgrade-inventory-grid">
            </div>
    </div>

    <div id="screen-deposit" class="screen">
        <div class="deposit-box">
            <div class="deposit-title">Покупка игровой валюты</div>
            
            <div class="currency-toggle">
                <button class="toggle-btn active ton" id="toggle-ton" onclick="setDepositCurrency('TON')">TON Native</button>
                <button class="toggle-btn stars" id="toggle-stars" onclick="setDepositCurrency('XTR')">Telegram Stars</button>
            </div>

            <div class="slider-container">
                <div class="slider-labels">
                    <span>Минимум</span>
                    <span>Максимум</span>
                </div>
                <div class="slider-value" id="deposit-amount-num">5.00</div>
                <input type="range" id="deposit-slider" min="0.5" max="50" step="0.5" value="5" oninput="updateDepositSliderValue()">
            </div>

            <button class="action-btn" id="deposit-pay-btn" style="background: linear-gradient(90deg, #0088cc, #00aacc); box-shadow: 0 4px 15px rgba(0,136,204,0.3); margin-bottom: 0;" onclick="startDepositPayment()">ОПЛАТИТЬ ПОПОЛНЕНИЕ</button>
        </div>

        <div class="admin-box">
            <h3>Админ-инструменты бэкенда</h3>
            <input type="text" class="admin-input" id="db-target-tgid" placeholder="Telegram ID игрока">
            <button class="admin-btn" onclick="dbAddBalanceAdmin()">Выдать +10 TON</button>
            <select class="admin-input" id="db-admin-nft-selector">
                <option value="1">Кольцо Ученика (Common)</option>
                <option value="2">Кольцо Искателя (Rare)</option>
                <option value="3">Кольцо Магистра (Epic)</option>
                <option value="4">Кольцо Владыки (Legendary)</option>
            </select>
            <button class="admin-btn" style="background:#00d270;" onclick="dbGiveNftAdmin()">Выдать выбранное NFT</button>
            <button class="admin-btn" style="background:#333;" onclick="dbWipeUserInventory()">Полный вайп инвентаря</button>
        </div>
    </div>

    <script>
        // БАЗОВЫЙ ДАТАСЕТ ПРЕДМЕТОВ
        const NFT_ITEMS = {
            1: { id: 1, name: "Кольцо Ученика", rarity: "common", class: "rare-common", img: "https://cdn-icons-png.flaticon.com/512/2143/2143150.png" },
            2: { id: 2, name: "Кольцо Искателя", rarity: "rare", class: "rare-rare", img: "https://cdn-icons-png.flaticon.com/512/2143/2143132.png" },
            3: { id: 3, name: "Кольцо Магистра", rarity: "epic", class: "rare-epic", img: "https://cdn-icons-png.flaticon.com/512/2143/2143147.png" },
            4: { id: 4, name: "Кольцо Владыки", rarity: "legendary", class: "rare-legendary", img: "https://cdn-icons-png.flaticon.com/512/2143/2143126.png" }
        };

        const CASE_CONFIGS = [
            { id: 0, name: "Common Case", cost: 0.5, pool: [1, 1, 1, 1, 2, 2, 3] },
            { id: 1, name: "Epic Case", cost: 2.0, pool: [2, 2, 3, 3, 3, 4] }
        ];

        // Инициализация Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Считываем реальные данные игрока из Telegram
        const userId = tg.initDataUnsafe?.user?.id || 999999;
        
        // Локальное состояние кошелька и инвентаря на фронте
        let userBalanceTon = parseFloat(localStorage.getItem(`bal_ton_${userId}`)) || 10.0;
        let userBalanceStars = parseInt(localStorage.getItem(`bal_stars_${userId}`)) || 150;
        let inventory = localStorage.getItem(`inventory_${userId}`) !== null ? JSON.parse(localStorage.getItem(`inventory_${userId}`)) : [1, 1, 1];
        
        let selectedCaseId = 0;
        let selectedCurrency = "TON";
        let craftSelectedIndices = [];
        let upgradeSourceIndex = null;

        function saveState() {
            localStorage.setItem(`bal_ton_${userId}`, userBalanceTon.toFixed(2));
            localStorage.setItem(`bal_stars_${userId}`, userBalanceStars);
            localStorage.setItem(`inventory_${userId}`, JSON.stringify(inventory));
            
            document.getElementById('balance-ton-display').innerText = `${userBalanceTon.toFixed(2)} TON`;
            document.getElementById('balance-stars-display').innerText = `${userBalanceStars} Stars`;
            document.getElementById('db-target-tgid').value = userId;
        }

        function switchScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`screen-${screenName}`).classList.add('active');
            event.target.classList.add('active');

            if(screenName === 'inventory') renderInventoryGrid();
            if(screenName === 'upgrade') renderUpgradeInventoryGrid();
        }

        function selectCase(id) {
            selectedCaseId = id;
            document.querySelectorAll('.case-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`case-${id}`).classList.add('active');
        }

        // РУЛЕТКА ОТКРЫТИЯ КЕЙСОВ
        function openCaseRoutine() {
            let config = CASE_CONFIGS[selectedCaseId];
            if(userBalanceTon < config.cost) { alert("Недостаточно TON на балансе!"); return; }

            userBalanceTon -= config.cost;
            saveState();

            let btn = document.getElementById('open-case-btn');
            btn.disabled = true;

            let track = document.getElementById('roulette-track');
            track.style.transition = "none";
            track.style.transform = "translateX(0px)";
            track.innerHTML = "";

            let localPool = [];
            for(let i=0; i<30; i++) {
                let randomId = config.pool[Math.floor(Math.random() * config.pool.length)];
                localPool.push(NFT_ITEMS[randomId]);
            }

            localPool.forEach(item => {
                let div = document.createElement('div');
                div.className = "roulette-item";
                div.innerHTML = `<img src="${item.img}"><span class="${item.class}">${item.name}</span>`;
                track.appendChild(div);
            });

            let prizeIndex = 24; 
            let prizeItem = localPool[prizeIndex];

            setTimeout(() => {
                track.style.transition = "transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)";
                let shift = -(prizeIndex * 100) + (document.getElementById('screen-cases').clientWidth / 2) - 140;
                track.style.transform = `translateX(${shift}px)`;
            }, 50);

            setTimeout(() => {
                inventory.push(prizeItem.id);
                saveState();
                btn.disabled = false;
                alert(`Поздравляем! Вы выбили: ${prizeItem.name}`);
            }, 4100);
        }

        // КРАФТ (Слияние 5 предметов в 1 высшего ранга)
        function renderInventoryGrid() {
            let grid = document.getElementById('inventory-grid');
            grid.innerHTML = "";
            craftSelectedIndices = [];
            document.getElementById('craft-btn').disabled = true;
            document.getElementById('craft-slots-counter').innerText = "Выбрано предметов для крафта: 0 / 5";

            if(inventory.length === 0) { grid.innerHTML = "<div style='grid-column:1/5; text-align:center; padding:20px; color:#575273;'>Инвентарь пуст</div>"; return; }

            inventory.forEach((itemId, index) => {
                let item = NFT_ITEMS[itemId];
                let div = document.createElement('div');
                div.className = "inventory-item";
                div.innerHTML = `<img src="${item.img}"><span class="${item.class}">${item.name.split(' ')[1]}</span>`;
                div.onclick = () => toggleCraftSelect(index, div);
                grid.appendChild(div);
            });
        }

        function toggleCraftSelect(index, element) {
            let lookup = craftSelectedIndices.indexOf(index);
            if(lookup > -1) {
                craftSelectedIndices.splice(lookup, 1);
                element.classList.remove('selected');
            } else {
                if(craftSelectedIndices.length >= 5) return;
                craftSelectedIndices.push(index);
                element.classList.add('selected');
            }
            document.getElementById('craft-slots-counter').innerText = `Выбрано предметов для крафта: ${craftSelectedIndices.length} / 5`;
            document.getElementById('craft-btn').disabled = (craftSelectedIndices.length !== 5);
        }

        function craftRoutine() {
            if(craftSelectedIndices.length !== 5) return;
            
            let sourceIds = craftSelectedIndices.map(i => inventory[i]);
            let firstId = sourceIds[0];
            let allSame = sourceIds.every(id => id === firstId);

            if(!allSame) { alert("Для крафта все 5 предметов должны быть абсолютно одинаковыми!"); return; }
            if(firstId === 4) { alert("Кольца Владыки максимального уровня! Крафт невозможен."); return; }

            craftSelectedIndices.sort((a,b) => b - a);
            craftSelectedIndices.forEach(i => inventory.splice(i, 1));

            let nextTierId = firstId + 1;
            inventory.push(nextTierId);
            saveState();
            renderInventoryGrid();
            alert(`Успешный крафт! Получено: ${NFT_ITEMS[nextTierId].name}`);
        }

        // АПГРЕЙД (Заточка кольца)
        let selectedSiteTargetId = 1;
        function renderUpgradeInventoryGrid() {
            let grid = document.getElementById('upgrade-inventory-grid');
            grid.innerHTML = "";
            removeSourceFromUpgrade();

            let itemsAvailable = inventory.filter(id => id < 4);
            if(itemsAvailable.length === 0) { grid.innerHTML = "<div style='grid-column:1/5; text-align:center; padding:20px; color:#575273;'>Нет предметов для улучшения</div>"; return; }

            inventory.forEach((itemId, index) => {
                if(itemId >= 4) return; 
                let item = NFT_ITEMS[itemId];
                let div = document.createElement('div');
                div.className = "inventory-item";
                div.innerHTML = `<img src="${item.img}"><span class="${item.class}">${item.name.split(' ')[1]}</span>`;
                div.onclick = () => selectSourceForUpgrade(index, itemId);
                grid.appendChild(div);
            });
        }

        function selectSourceForUpgrade(index, itemId) {
            upgradeSourceIndex = index;
            let item = NFT_ITEMS[itemId];
            
            let slot = document.getElementById('upgrade-slot-source');
            slot.innerHTML = `<img src="${item.img}"><span class="${item.class}">${item.name}</span>`;
            
            let nextItem = NFT_ITEMS[itemId + 1];
            selectedSiteTargetId = itemId + 1;
            
            document.getElementById('ring-target-preview').src = nextItem.img;
            document.getElementById('ring-target-preview').style.display = "block";
            document.getElementById('ring-target-placeholder').style.display = "none";
            
            let chance = itemId === 1 ? 75 : (itemId === 2 ? 45 : 20);
            document.getElementById('upgrade-chance-text').innerText = `Шанс успеха: ${chance}%`;
            document.getElementById('upgrade-execute-btn').disabled = false;
        }

        function removeSourceFromUpgrade() {
            upgradeSourceIndex = null;
            document.getElementById('upgrade-slot-source').innerHTML = "<span>Нажмите на предмет внизу</span>";
            document.getElementById('ring-target-preview').style.display = "none";
            document.getElementById('ring-target-placeholder').style.display = "block";
            document.getElementById('upgrade-chance-text').innerText = "Шанс успеха: -- %";
            document.getElementById('upgrade-execute-btn').disabled = true;
        }

        function upgradeRoutine() {
            if(upgradeSourceIndex === null) return;
            let currentId = inventory[upgradeSourceIndex];
            let chance = currentId === 1 ? 75 : (currentId === 2 ? 45 : 20);
            
            let roll = Math.random() * 100;
            if(roll <= chance) {
                inventory[upgradeSourceIndex] = currentId + 1;
                alert("🔥 УСПЕХ! Ваше кольцо улучшено рангом выше!");
            } else {
                inventory.splice(upgradeSourceIndex, 1);
                alert("💥 Крах... Предмет разрушился при попытке апгрейда.");
            }
            saveState();
            renderUpgradeInventoryGrid();
        }

        // КАССА: ЛОГИКА ДЛЯ ПОЛЗУНКОВ И СМЕНЫ ВАЛЮТЫ
        function setDepositCurrency(type) {
            selectedCurrency = type;
            let slider = document.getElementById('deposit-slider');
            
            document.getElementById('toggle-ton').classList.remove('active');
            document.getElementById('toggle-stars').classList.remove('active');
            slider.classList.remove('stars');

            if(type === 'TON') {
                document.getElementById('toggle-ton').classList.add('active');
                slider.min = 0.5; slider.max = 50; slider.step = 0.5; slider.value = 5;
                document.getElementById('deposit-pay-btn').style.background = "linear-gradient(90deg, #0088cc, #00aacc)";
                document.getElementById('deposit-pay-btn').style.boxShadow = "0 4px 15px rgba(0,136,204,0.3)";
            } else {
                document.getElementById('toggle-stars').classList.add('active');
                slider.classList.add('stars');
                slider.min = 10; slider.max = 1000; slider.step = 10; slider.value = 150;
                document.getElementById('deposit-pay-btn').style.background = "linear-gradient(90deg, var(--neon-gold), #e6a100)";
                document.getElementById('deposit-pay-btn').style.boxShadow = "0 4px 15px rgba(255,183,0,0.3)";
            }
            updateDepositSliderValue();
        }

        function updateDepositSliderValue() {
            let val = document.getElementById('deposit-slider').value;
            let label = document.getElementById('deposit-amount-num');
            if(selectedCurrency === 'TON') {
                label.innerHTML = `${parseFloat(val).toFixed(2)} <span>TON</span>`;
            } else {
                label.innerHTML = `${parseInt(val)} <span>Stars</span>`;
            }
        }

        // ============================================================
        // ФИКС КНОПКИ: ИСПРАВЛЕННАЯ ФУНКЦИЯ ОТПРАВКИ ЧЕРЕЗ INLINE QUERY
        // ============================================================
        function startDepositPayment() {
            let sliderVal = parseFloat(document.getElementById('deposit-slider').value);
            
            let amountTon = 5.0;
            let amountStars = 75;

            // Расчет пропорций в зависимости от выбранной вкладки валюты
            if (selectedCurrency === "TON") {
                amountTon = sliderVal;
                amountStars = Math.round(sliderVal * 15); // Курс 1 TON = 15 Stars
            } else {
                amountStars = parseInt(sliderVal);
                amountTon = parseFloat((sliderVal / 15).toFixed(2));
            }

            // Упаковываем данные для отправки в Python-бот
            const dataToSend = {
                action: "deposit_request",
                amount_ton: amountTon,
                amount_stars: amountStars,
                currency: selectedCurrency // Передаст "TON" или "XTR"
            };

            // Превращаем объект в JSON-строку
            const jsonString = JSON.stringify(dataToSend);

            // ЖЕЛЕЗНЫЙ МЕТОД: Отправляем строку в инлайн-режим бота
            if (window.Telegram && window.Telegram.WebApp) {
                tg.sendInlineQuery(jsonString);
                tg.close(); // Закрываем WebApp, бот мгновенно продолжит операцию в чате
            } else {
                alert(`Тестовый режим браузера:\nОтправка JSON на бэкенд: ${jsonString}`);
            }
        }


        // АДМИН-МЕТОДЫ СИМУЛЯЦИИ РАБОТЫ БД И СЕРВЕРА
        function dbAddBalanceAdmin() {
            userBalanceTon += 10.0;
            saveState();
            alert("Админ-Бэкенд: Баланс игрока успешно пополнен на +10 TON");
        }

        function dbGiveNftAdmin() {
            let nftId = parseInt(document.getElementById('db-admin-nft-selector').value);
            let targetId = document.getElementById('db-target-tgid').value.trim();
            if(!targetId) { alert("Сначала введи Telegram ID игрока!"); return; }
            
            let targetInventoryRaw = localStorage.getItem(`inventory_${targetId}`) !== null ? JSON.parse(localStorage.getItem(`inventory_${targetId}`)) : [];
            
            targetInventoryRaw.push(nftId);
            localStorage.setItem(`inventory_${targetId}`, JSON.stringify(targetInventoryRaw));

            if(targetId == userId) { inventory = targetInventoryRaw; saveState(); }
            alert(`Предмет успешно выдан игроку ${targetId}!`);
        }

        function dbWipeUserInventory() {
            let targetId = document.getElementById('db-target-tgid').value.trim();
            if(!targetId) { alert("Сначала введи Telegram ID игрока!"); return; }

            if(confirm(`Ты уверен, что хочешь ПОЛНОСТЬЮ очистить инвентарь игрока ${targetId}?`)) {
                localStorage.setItem(`inventory_${targetId}`, JSON.stringify([]));
                if(targetId == userId) { inventory = []; saveState(); }
                alert(`Инвентарь игрока ${targetId} полностью очищен!`);
            }
        }

        window.onload = () => {
            saveState();
            updateDepositSliderValue();
            if(NFT_ITEMS[selectedSiteTargetId]) document.getElementById('ring-target-preview').src = NFT_ITEMS[selectedSiteTargetId].img;
        };
    </script>
</body>
</html>

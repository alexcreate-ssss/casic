<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON NFT ARCADE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c0a14;
            --bg-card: #131022;
            --bg-panel: #1a1630;
            --neon-blue: #00f2fe;
            --neon-pink: #f857a6;
            --neon-green: #00ff87;
            --neon-gold: #ffb700;
            --text-muted: #575273;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--bg-main); color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; }

        /* Шапка */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; }
        .logo { 
            font-weight: 900;
            font-size: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            background: linear-gradient(90deg, #fff, var(--neon-blue)); 
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent;
        }
        .balance-container { background: rgba(0, 255, 135, 0.1); border: 1px solid rgba(0, 255, 135, 0.2); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .balance-val { color: var(--neon-green); }

        /* Табы навигации */
        .tabs-nav { display: flex; background: var(--bg-card); border-radius: 12px; padding: 4px; margin-bottom: 10px; gap: 4px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 10px 0; font-weight: bold; font-size: 11px; cursor: pointer; border-radius: 8px; transition: all 0.2s; text-transform: uppercase; }
        .tab-btn.active { background: var(--bg-panel); color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 254, 0.1); }

        .screen { display: none; flex-direction: column; flex-grow: 1; }
        .screen.active { display: flex; }

        /* ================= АПГРЕЙД ================= */
        .upgrade-top-area { background: var(--bg-card); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; position: relative; margin-bottom: 10px; }
        .upg-center-ring { position: relative; width: 140px; height: 140px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .ring-canvas { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .ring-preview-img { width: 75px; height: 75px; object-fit: contain; z-index: 2; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6)); }
        .chance-badge { background: rgba(0, 255, 137, 0.1); border: 1px solid rgba(0, 255, 137, 0.2); padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; color: var(--neon-green); margin-bottom: 12px; }
        .action-controls-row { display: flex; width: 100%; gap: 6px; align-items: center; }
        .ring-btn { flex: 2; background: linear-gradient(135deg, var(--neon-blue), #0072ff); border: none; padding: 14px; border-radius: 12px; color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; text-transform: uppercase; }
        .grid-multipliers { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

        .upgrade-bottom-split { display: flex; gap: 10px; flex-grow: 1; height: calc(100vh - 330px); min-height: 240px; }
        .split-column { flex: 1; background: var(--bg-card); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; width: 50%; }
        .column-header { font-size: 11px; font-weight: bold; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .column-grid-scroll { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
        
        .split-card { background: var(--bg-panel); border-radius: 10px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; border: 2px solid transparent; cursor: pointer; }
        .split-card img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 6px; }
        .split-card h5 { font-size: 10px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .split-card span { font-size: 10px; color: var(--neon-gold); font-weight: bold; }
        .split-card.selected-src { border-color: var(--neon-pink); background: rgba(248, 87, 166, 0.08); }
        .split-card.selected-tar { border-color: var(--neon-blue); background: rgba(0, 242, 254, 0.08); }

        /* ================= КЕЙСЫ ================= */
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .case-card { background: var(--bg-card); border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; }
        .case-card img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 6px; }
        
        .arena-view { display: none; background: var(--bg-card); border-radius: 16px; padding: 12px; flex-direction: column; }
        .multi-canvas-grid { display: grid; gap: 8px; width: 100%; margin-bottom: 12px; }
        .multi-canvas-grid.grid-1 { grid-template-columns: 1fr; }
        .multi-canvas-grid.grid-2 { grid-template-columns: 1fr 1fr; }
        .multi-canvas-grid.grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        
        .roulette-container { position: relative; width: 100%; height: 120px; background: #04030a; border: 2px solid var(--bg-panel); border-radius: 12px; overflow: hidden; }
        .roulette-track { display: flex; position: absolute; left: 0; top: 12px; height: 96px; will-change: transform; }
        .roulette-item { flex: 0 0 90px; width: 90px; height: 96px; background: var(--bg-card); border-radius: 8px; margin-right: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }
        .roulette-item img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 4px; }
        .roulette-item span { font-size: 9px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .roulette-item .item-cost { color: var(--neon-gold); font-weight: bold; }
        .roulette-center-line { position: absolute; left: 50%; top: 0; width: 3px; height: 100%; background: var(--neon-blue); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 8px var(--neon-blue); }
        
        /* Витрина предметов внизу */
        .case-loot-showcase { background: var(--bg-main); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; margin-top: 15px; }
        .loot-header-lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; letter-spacing: 0.5px; }
        .loot-scroll-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .loot-mini-node { flex: 0 0 75px; background: var(--bg-panel); border-radius: 8px; padding: 6px; text-align: center; font-size: 9px; border-bottom: 3px solid #fff; }
        .loot-mini-node img { width: 35px; height: 35px; object-fit: contain; margin-bottom: 4px; }

        .main-btn { width: 100%; background: linear-gradient(90deg, var(--neon-green), #00cb62); border: none; padding: 12px; border-radius: 10px; color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 12px; text-align: center; }

        /* ================= СУМКА ================= */
        .sub-nav { display: flex; gap: 6px; margin-bottom: 10px; }
        .sub-tab { flex: 1; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; color: #aaa; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .sub-tab.active { background: var(--bg-panel); color: var(--neon-pink); border-color: rgba(248,87,166,0.2); }
        
        .inv-grid { display: grid; grid-template-columns: 1fr; gap: 8px; overflow-y: auto; }
        .inv-card { background: var(--bg-card); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 12px; border-left: 4px solid #fff; position: relative; }
        .inv-card img { width: 45px; height: 45px; object-fit: contain; }
        .inv-details { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
        .inv-details h5 { font-size: 12px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .inv-details .price { font-size: 11px; color: var(--neon-gold); font-weight: bold; }
        
        .inv-actions-holder { display: flex; gap: 4px; align-items: center; }
        .action-sub-btn { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.05); color: #fff; font-size: 10px; font-weight: bold; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
        .action-sub-btn.btn-withdraw { background: rgba(0, 255, 135, 0.1); border-color: rgba(0, 255, 135, 0.2); color: var(--neon-green); font-size: 11px; padding: 8px 14px; }

        .history-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
        .history-item { background: var(--bg-card); border-left: 4px solid var(--neon-pink); padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }

        .r-mil { border-left-color: #5e98d9; border-bottom-color: #5e98d9;}
        .r-rest { border-left-color: #00f2fe; border-bottom-color: #00f2fe;}
        .r-class { border-left-color: #b230ff; border-bottom-color: #b230ff;}
        .r-cov { border-left-color: #eb4b4b; border-bottom-color: #eb4b4b;}

        /* ================= КАССА ================= */
        .cash-box-panel { background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 12px; text-align: center; }
        .slider-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .slider-amount-badge { font-size: 20px; font-weight: 900; color: var(--neon-green); }
        
        /* Инпут для ручного ввода суммы пополнения */
        .deposit-input-wrapper { margin-bottom: 15px; text-align: left; position: relative; display: flex; align-items: center; background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0 14px; }
        .deposit-input-style { width: 100%; background: transparent; border: none; padding: 12px 0; color: #fff; font-size: 15px; font-weight: bold; outline: none; -moz-appearance: textfield; user-select: text; -webkit-user-select: text; }
        .deposit-input-style::-webkit-outer-spin-button, .deposit-input-style::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .deposit-input-currency { font-weight: bold; color: var(--neon-green); font-size: 14px; margin-left: 8px; }

        .custom-range-input { -webkit-appearance: none; width: 100%; height: 6px; background: var(--bg-panel); border-radius: 5px; outline: none; margin-bottom: 20px; }
        .custom-range-input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--neon-blue); cursor: pointer; box-shadow: 0 0 8px var(--neon-blue); }

        .currency-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .curr-select-btn { flex: 1; background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; color: #aaa; font-weight: bold; font-size: 12px; cursor: pointer; }
        .curr-select-btn.active.mode-stars { border-color: var(--neon-gold); color: var(--neon-gold); background: rgba(255,183,0,0.05); }
        .curr-select-btn.active.mode-ton { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(0,242,254,0.05); }

        /* ================= АДМИН-ЦЕНТР ================= */
        .admin-panel { display: none; background: rgba(248, 87, 166, 0.02); border: 2px dashed var(--neon-pink); border-radius: 16px; padding: 14px; margin-top: 15px; text-align: left; }
        .admin-input-style { width: 100%; background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; color: #fff; font-size: 12px; margin-top: 5px; margin-bottom: 10px; outline: none; user-select: text; -webkit-user-select: text; }
        
        .db-inspector-card { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 10px; margin-bottom: 12px; font-size: 11px; }
        .db-log-line { color: var(--neon-blue); font-weight: bold; margin-bottom: 4px; }
        .db-inv-chips-holder { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .db-chip { background: #0c0a14; border: 1px solid #333; padding: 3px 6px; border-radius: 4px; font-size: 9px; color: #ccc; }

        .admin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 8px; }
        .admin-btn { background: #201128; border: 1px solid var(--neon-pink); color: #fff; padding: 10px 0; font-size: 11px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; text-align: center; }
        .admin-btn:active { background: var(--neon-pink); color: #000; }

        .mini-btn { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.03); color: #aaa; border-radius: 8px; padding: 12px 0; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
        .mini-btn.active { background: var(--neon-blue); color: #000; }

        /* ================= МОДАЛКА ДРОПА ================= */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(3,2,7,0.96); z-index: 100; align-items: center; justify-content: center; padding: 15px; }
        .modal-body { background: var(--bg-card); border-radius: 20px; padding: 20px; width: 100%; max-width: 420px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .win-title { color: var(--neon-green); font-size: 18px; font-weight: 900; margin-bottom: 15px; }
        
        .win-flex-vertical { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding: 5px; margin-bottom: 15px; }
        .win-action-row { background: var(--bg-panel); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--neon-blue); }
        .win-action-row img { width: 45px; height: 45px; object-fit: contain; }
        .win-action-info { flex-grow: 1; text-align: left; }
        .win-action-info h6 { font-size: 12px; color: #fff; margin-bottom: 2px; }
        .win-action-info span { font-size: 10px; color: var(--neon-gold); font-weight: bold; }
        
        .win-action-buttons { display: flex; flex-direction: column; gap: 4px; }
        .drop-choice-btn { background: #0c0a14; border: 1px solid rgba(255,255,255,0.1); color: #ccc; font-size: 9px; font-weight: bold; padding: 5px 8px; border-radius: 6px; cursor: pointer; text-transform: uppercase; text-align: center; min-width: 80px; }
        .drop-choice-btn.c-upg  { border-color: var(--neon-blue); color: var(--neon-blue); }
        .drop-choice-btn.c-sell { border-color: var(--neon-pink); color: var(--neon-pink); }
        .drop-choice-btn.c-keep { border-color: var(--neon-green); color: var(--neon-green); }

        .disabled { opacity: 0.3; pointer-events: none; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--bg-panel); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="logo">💎 TON NFT ARCADE</div>
        <div class="balance-container">
            <span class="balance-val" id="global-balance">0.00</span> TON
        </div>
    </div>

    <div class="tabs-nav">
        <button class="tab-btn active" id="btn-tab-upg" onclick="switchTab('upg')">⚡ Апгрейд</button>
        <button class="tab-btn" id="btn-tab-cases" onclick="switchTab('cases')">📦 Кейсы</button>
        <button class="tab-btn" id="btn-tab-inv" onclick="switchTab('inv')">🎒 Сумка</button>
        <button class="tab-btn" id="btn-tab-cash" onclick="switchTab('cash')">👛 Касса</button>
    </div>

    <div id="screen-upg" class="screen active">
        <div class="upgrade-top-area">
            <div class="upg-center-ring">
                <canvas class="ring-canvas" id="ring-canvas" width="140" height="140"></canvas>
                <img src="" class="ring-preview-img" id="ring-target-preview">
            </div>
            <div class="chance-badge" id="chance-badge-val">ВЫБЕРИТЕ ДЕПОЗИТ</div>
            <div class="action-controls-row">
                <button class="ring-btn" id="ring-action-btn" onclick="startUpgradeProcess()">⚡ УЛУЧШИТЬ</button>
                <div class="grid-multipliers">
                    <button class="mini-btn" onclick="shortcutMultiplier(2)">x2</button>
                    <button class="mini-btn" onclick="shortcutMultiplier(5)">x5</button>
                    <button class="mini-btn" onclick="shortcutMultiplier(10)">x10</button>
                </div>
            </div>
        </div>

        <div class="upgrade-bottom-split">
            <div class="split-column">
                <div class="column-header">Мои подарки 🎒</div>
                <div class="column-grid-scroll" id="upg-left-my-inventory"></div>
            </div>
            <div class="split-column">
                <div class="column-header">Цели сайта 🎯</div>
                <div class="column-grid-scroll" id="upg-right-site-targets"></div>
            </div>
        </div>
    </div>

    <div id="screen-cases" class="screen">
        <div class="cases-grid" id="cases-selector-view"></div>
        
        <div class="arena-view" id="cases-arena-view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <button class="mini-btn" style="padding:4px 10px;" onclick="closeArenaView()">◀ Выйти</button>
                <h4 id="arena-title" style="color:var(--neon-blue); font-size:13px;">Кейс</h4>
                <div style="display:flex; gap:3px;">
                    <button class="mini-btn" style="padding:4px 8px;" id="m-count-1" onclick="changeMultiCount(1)">x1</button>
                    <button class="mini-btn" style="padding:4px 8px;" id="m-count-2" onclick="changeMultiCount(2)">x2</button>
                    <button class="mini-btn" style="padding:4px 8px;" id="m-count-4" onclick="changeMultiCount(4)">x4</button>
                </div>
            </div>

            <div class="multi-canvas-grid" id="canvas-holders-container"></div>
            <button class="main-btn" id="btn-trigger-case" onclick="triggerCaseOpening()">ОТКРЫТЬ КЕЙС ЗА <span id="case-action-cost">0.00</span> TON</button>

            <div class="case-loot-showcase">
                <div class="loot-header-lbl">Возможный дроп из кейса:</div>
                <div class="loot-scroll-row" id="case-loot-items-row"></div>
            </div>
        </div>
    </div>

    <div id="screen-inv" class="screen">
        <div class="sub-nav">
            <div class="sub-tab active" id="sub-btn-items" onclick="switchSubInv('items')">Предметы</div>
            <div class="sub-tab" id="sub-btn-history" onclick="switchSubInv('history')">История выводов</div>
        </div>
        <div id="sub-screen-items" style="display: grid;" class="inv-grid"></div>
        <div id="sub-screen-history" style="display: none;" class="history-list"></div>
    </div>

    <div id="screen-cash" class="screen">
        <div class="cash-box-panel">
            <div class="slider-title-row">
                <span style="font-size:13px; color:#aaa; font-weight:bold;">Сумма пополнения:</span>
                <span class="slider-amount-badge"><span id="deposit-amount-lbl">0.1</span> TON</span>
            </div>
            
            <div class="deposit-input-wrapper">
                <input type="number" min="0.5" max="1000" step="0.5" value="0.5" class="deposit-input-style" id="cash-text-input" oninput="updateDepositInputValue()" placeholder="Введите сумму...">
                <span class="deposit-input-currency">TON</span>
            </div>

            <input type="range" min="0.5" max="30" step="0.5" value="0.5" class="custom-range-input" id="cash-range-slider" oninput="updateDepositSliderValue()">
            
            <div class="currency-tabs">
                <button class="curr-select-btn active mode-stars" id="pay-method-stars" onclick="switchPayMethod('XTR')">🌟 Telegram Stars (<span id="stars-cost-calculated">2</span>)</button>
                <button class="curr-select-btn mode-ton" id="pay-method-ton" onclick="switchPayMethod('TON')">💎 Через TON Прямо</button>
            </div>

            <button class="main-btn" style="background:linear-gradient(135deg, var(--neon-blue), #0072ff); color:#fff; font-size:14px; padding:14px 0;" onclick="sendDepositInvoiceToBot()">ОПЛАТИТЬ ПОПОЛНЕНИЕ</button>
        </div>
        
        <div class="admin-panel" id="admin-secret-block">
            <h4 style="color:var(--neon-pink); font-size:12px; font-weight: bold; text-transform: uppercase;">🛠️ ПАНЕЛЬ УПРАВЛЕНИЯ БАЗОЙ ДАННЫХ</h4>
            
            <label style="font-size:10px; color:#aaa; display:block; margin-top:8px;">Telegram ID целевого игрока:</label>
            <input type="number" id="db-target-tgid" class="admin-input-style" placeholder="Введи ID, например: 583920194">

            <button class="main-btn" style="background:var(--bg-panel); color:var(--neon-blue); border:1px solid var(--neon-blue); font-size:11px; margin-bottom:12px; padding:8px 0;" onclick="dbInspectUserAccount()">🔍 ЗАГРУЗИТЬ ДАННЫЕ ИГРОКА</button>

            <div class="db-inspector-card">
                <div class="db-log-line">Статус: <span id="db-insp-status" style="color:#fff;">Не загружен</span></div>
                <div class="db-log-line">Баланс в БД: <span id="db-insp-balance" style="color:var(--neon-green);">0.00 TON</span></div>
                <div style="font-weight: bold; color:#aaa; margin-top:5px;">Предметы в сумке:</div>
                <div class="db-inv-chips-holder" id="db-insp-inventory-chips">
                    <span style="color:var(--text-muted);">Введите ID и загрузите профиль</span>
                </div>
            </div>

            <div class="admin-grid">
                <button class="admin-btn" style="border-color:var(--neon-green); color:var(--neon-green);" onclick="dbModifyBalance(10)">+10 TON</button>
                <button class="admin-btn" style="border-color:var(--neon-pink); color:var(--neon-pink);" onclick="dbModifyBalance(-10)">-10 TON</button>
            </div>
            
            <label style="font-size:10px; color:#aaa; display:block; margin-top:4px;">Выдать конкретный предмет игроку:</label>
            <div style="display:flex; gap:4px; margin-top:4px; margin-bottom:10px;">
                <select id="db-admin-nft-selector" class="admin-input-style" style="margin:0; flex-grow:1;"></select>
                <button class="admin-btn" style="padding:0 15px; border-color:var(--neon-gold); color:var(--neon-gold);" onclick="dbInjectNftToUser()">Выдать</button>
            </div>

            <button class="admin-btn" style="width:100%; border-color:#ff3333; color:#ff3333; font-size:10px;" onclick="dbWipeUserInventory()">🚨 ПОЛНАЯ ОЧИСТКА ИНВЕНТАРЯ ИГРОКА</button>
        </div>
    </div>

    <div class="modal" id="global-win-modal">
        <div class="modal-body">
            <h3 class="win-title">🎉 ВАШ ВЫИГРЫШ!</h3>
            <div class="win-flex-vertical" id="win-modal-nodes-holder"></div>
            <button class="main-btn" style="background:var(--bg-panel); color:#fff; border:1px solid #333;" onclick="closeWinModal()">Готово</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if(tg) { tg.expand(); tg.ready(); }

        const ADMIN_TELEGRAM_ID = 1101669771;

        const NFT_ITEMS = [
            { id: 0, name: "Notcoin Voucher", price: 1.00, img: "https://i.ibb.co/1GJqx9pP/nft-0.webp", rarity: "mil" },
            { id: 1, name: "TON Punk #2410", price: 2.50, img: "https://i.ibb.co/T58pg0G/nft-1.webp", rarity: "mil" },
            { id: 2, name: "Anonymous +888", price: 5.00, img: "https://i.ibb.co/svg8q1H9/nft-2.webp", rarity: "rest" },
            { id: 3, name: "Whales Club NFT", price: 12.00, img: "https://i.ibb.co/SwPYKyQS/nft-3.webp", rarity: "class" },
            { id: 4, name: "Username @durov", price: 30.00, img: "https://i.ibb.co/F4ccZq8Z/nft-4.webp", rarity: "cov" },
            { id: 5, name: "Alpha Avatar", price: 85.00, img: "https://i.ibb.co/4RJ5prGj/nft-5.webp", rarity: "cov" }
        ];

        const CASES = [
            { id: 0, name: "Starter Notcoin Box", price: 1.50, items: [0, 1], img: "assets/cases/case_0.png" },
            { id: 1, name: "Anonymous Case", price: 4.00, items: [0, 1, 2], img: "assets/cases/case_1.png" },
            { id: 2, name: "Durov's VIP Pack", price: 25.00, items: [3, 4, 5], img: "assets/cases/case_2.png" }
        ];

        function getCurrentUserId() {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                return tg.initDataUnsafe.user.id;
            }
            return "default_user";
        }

        let userId = getCurrentUserId();
        
        let balance = localStorage.getItem(`balance_${userId}`) !== null ? parseFloat(localStorage.getItem(`balance_${userId}`)) : 15.50;
        let inventory = localStorage.getItem(`inventory_${userId}`) !== null ? JSON.parse(localStorage.getItem(`inventory_${userId}`)) : [0, 1];
        let historyLogs = localStorage.getItem(`history_${userId}`) !== null ? JSON.parse(localStorage.getItem(`history_${userId}`)) : [];

        let selectedMyInvIndex = null; 
        let selectedSiteTargetId = 2;
        let currentChance = 0;
        let isSpinning = false;
        let multiCount = 1;
        let activeCaseId = 0;
        let ringCanvas, ringCtx;
        let chosenCurrencyMode = 'XTR';

        function saveState() {
            localStorage.setItem(`balance_${userId}`, balance);
            localStorage.setItem(`inventory_${userId}`, JSON.stringify(inventory));
            localStorage.setItem(`history_${userId}`, JSON.stringify(historyLogs));
            document.getElementById('global-balance').innerText = balance.toFixed(2);
        }

        function checkAdminAccess() {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id === ADMIN_TELEGRAM_ID && ADMIN_TELEGRAM_ID !== 0) {
                document.getElementById('admin-secret-block').style.display = 'block';
                populateAdminNftSelect();
            } else {
                document.getElementById('admin-secret-block').style.display = 'none';
            }
        }

        function populateAdminNftSelect() {
            const select = document.getElementById('db-admin-nft-selector');
            if(select && select.children.length === 0) {
                NFT_ITEMS.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.id;
                    opt.innerText = `${item.name} (${item.price} TON)`;
                    select.appendChild(opt);
                });
            }
        }

        function switchTab(tabId) {
            if(isSpinning || document.getElementById('btn-trigger-case').classList.contains('disabled')) return;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`screen-${tabId}`).classList.add('active');
            document.getElementById(`btn-tab-${tabId}`).classList.add('active');
            if(tabId === 'upg') renderUpgradeSplitScreen();
            if(tabId === 'cases') initCasesCatalog();
            if(tabId === 'inv') switchSubInv('items');
            if(tabId === 'cash') checkAdminAccess();
        }

        /* ================= АПГРЕЙД ================= */
        function renderUpgradeSplitScreen() {
            const leftContainer = document.getElementById('upg-left-my-inventory');
            leftContainer.innerHTML = '';
            if(inventory.length === 0) {
                leftContainer.innerHTML = '<div style="grid-column:1/-1; text-align:center; font-size:10px; color:var(--text-muted); padding-top:20px;">Пусто</div>';
            } else {
                inventory.forEach((itemId, idx) => {
                    const item = NFT_ITEMS[itemId];
                    if(!item) return;
                    const card = document.createElement('div');
                    card.className = `split-card ${selectedMyInvIndex === idx ? 'selected-src' : ''}`;
                    card.innerHTML = `<img src="${item.img}"><h5>${item.name}</h5><span>${item.price.toFixed(2)} TON</span>`;
                    card.onclick = () => {
                        if(isSpinning) return;
                        selectedMyInvIndex = idx;
                        recalculateUpgradeChance();
                        renderUpgradeSplitScreen();
                    };
                    leftContainer.appendChild(card);
                });
            }
            const rightContainer = document.getElementById('upg-right-site-targets');
            rightContainer.innerHTML = '';
            NFT_ITEMS.forEach(item => {
                const card = document.createElement('div');
                card.className = `split-card ${selectedSiteTargetId === item.id ? 'selected-tar' : ''}`;
                card.innerHTML = `<img src="${item.img}"><h5>${item.name}</h5><span>${item.price.toFixed(2)} TON</span>`;
                card.onclick = () => {
                    if(isSpinning) return;
                    selectedSiteTargetId = item.id;
                    recalculateUpgradeChance();
                    renderUpgradeSplitScreen();
                };
                rightContainer.appendChild(card);
            });
            recalculateUpgradeChance();
        }

        function recalculateUpgradeChance() {
            if(selectedMyInvIndex === null) {
                currentChance = 0;
                document.getElementById('chance-badge-val').innerText = "ВЫБЕРИТЕ ДЕПОЗИТ";
                if(NFT_ITEMS[selectedSiteTargetId]) document.getElementById('ring-target-preview').src = NFT_ITEMS[selectedSiteTargetId].img;
                drawStaticRing(0);
                return;
            }
            const myItem = NFT_ITEMS[inventory[selectedMyInvIndex]];
            const targetItem = NFT_ITEMS[selectedSiteTargetId];
            if(!myItem || !targetItem) return;
            document.getElementById('ring-target-preview').src = targetItem.img;
            if(targetItem.price <= myItem.price) {
                currentChance = 0;
                document.getElementById('chance-badge-val').innerText = "ЦЕЛЬ ДОЛЖНА БЫТЬ ДОРОЖЕ";
                drawStaticRing(0);
                return;
            }
            let chance = (myItem.price / targetItem.price) * 100;
            chance = Math.max(0.1, Math.min(95, chance));
            currentChance = chance;
            document.getElementById('chance-badge-val').innerText = `${chance.toFixed(2)}% ШАНС`;
            drawStaticRing(chance / 100);
        }

        function drawStaticRing(progress) {
            if(!ringContextInit()) return;
            ringCtx.clearRect(0, 0, 140, 140);
            ringCtx.lineWidth = 6;
            ringCtx.strokeStyle = "rgba(255,255,255,0.04)";
            ringCtx.beginPath();
            ringCtx.arc(70, 70, 62, 0, Math.PI * 2);
            ringCtx.stroke();
            if(progress <= 0) return;
            let startAngle = -Math.PI / 2;
            let endAngle = startAngle + (Math.PI * 2 * progress);
            ringCtx.strokeStyle = "var(--neon-blue)";
            ringCtx.shadowBlur = 8;
            ringCtx.shadowColor = "var(--neon-blue)";
            ringCtx.beginPath();
            ringCtx.arc(70, 70, 62, startAngle, endAngle);
            ringCtx.stroke();
            ringCtx.shadowBlur = 0;
        }

        function ringContextInit() {
            if(!ringCanvas) {
                ringCanvas = document.getElementById('ring-canvas');
                if(!ringCanvas) return false;
                ringCtx = ringCanvas.getContext('2d');
            }
            return true;
        }

        function startUpgradeProcess() {
            if(isSpinning || selectedMyInvIndex === null || currentChance <= 0) return;
            isSpinning = true;
            document.getElementById('ring-action-btn').classList.add('disabled');
            let spinDuration = 3500;
            let startTime = performance.now();
            let targetRoll = Math.random();
            let isWin = targetRoll <= (currentChance / 100);

            function animate(now) {
                let elapsed = now - startTime;
                let t = Math.min(elapsed / spinDuration, 1);
                let easeOut = 1 - Math.pow(1 - t, 4);
                ringCtx.clearRect(0, 0, 140, 140);
                ringCtx.lineWidth = 6;
                ringCtx.strokeStyle = "rgba(255,255,255,0.04)";
                ringCtx.beginPath();
                ringCtx.arc(70, 70, 62, 0, Math.PI * 2);
                ringCtx.stroke();
                let startAngle = -Math.PI / 2;
                let endAngle = startAngle + (Math.PI * 2 * (currentChance / 100));
                ringCtx.strokeStyle = "var(--neon-blue)";
                ringCtx.beginPath();
                ringCtx.arc(70, 70, 62, startAngle, endAngle);
                ringCtx.stroke();
                let currentAngle = -Math.PI / 2 + (easeOut * (Math.PI * 2 * 6 + (targetRoll * Math.PI * 2)));
                ringCtx.lineWidth = 4;
                ringCtx.strokeStyle = "#fff";
                ringCtx.shadowBlur = 10;
                ringCtx.shadowColor = "#fff";
                ringCtx.beginPath();
                ringCtx.arc(70, 70, 62, currentAngle - 0.05, currentAngle + 0.05);
                ringCtx.stroke();
                ringCtx.shadowBlur = 0;
                if(t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    finalizeUpgrade(isWin);
                }
            }
            requestAnimationFrame(animate);
        }

        function finalizeUpgrade(isWin) {
            isSpinning = false;
            document.getElementById('ring-action-btn').classList.remove('disabled');
            let myItem = NFT_ITEMS[inventory[selectedMyInvIndex]];
            let targetItem = NFT_ITEMS[selectedSiteTargetId];
            if(isWin) {
                inventory.splice(selectedMyInvIndex, 1);
                inventory.push(targetItem.id);
                triggerWinModalNode([{ name: targetItem.name, price: targetItem.price, img: targetItem.img, status: "Успешный Апгрейд!" }]);
            } else {
                inventory.splice(selectedMyInvIndex, 1);
                alert(`Апгрейд сорвался! Вы потеряли ${myItem.name}`);
            }
            selectedMyInvIndex = null;
            saveState();
            renderUpgradeSplitScreen();
        }

        function shortcutMultiplier(mult) {
            if(selectedMyInvIndex === null) return;
            let currentItem = NFT_ITEMS[inventory[selectedMyInvIndex]];
            let neededPrice = currentItem.price * mult;
            let exactMatch = NFT_ITEMS.find(x => x.price >= neededPrice);
            if(exactMatch) {
                selectedSiteTargetId = exactMatch.id;
                recalculateUpgradeChance();
                renderUpgradeSplitScreen();
            } else {
                alert("Нет подходящей цели под такой множитель!");
            }
        }

        /* ================= КЕЙСЫ ================= */
        function initCasesCatalog() {
            closeArenaView();
            const root = document.getElementById('cases-selector-view');
            root.innerHTML = '';
            CASES.forEach(c => {
                let card = document.createElement('div');
                card.className = 'case-card';
                card.innerHTML = `<img src="${c.img}"><h4>${c.name}</h4><span style="color:var(--neon-gold); font-size:11px; font-weight:bold;">${c.price.toFixed(2)} TON</span>`;
                card.onclick = () => openArenaView(c.id);
                root.appendChild(card);
            });
        }

        function openArenaView(caseId) {
            activeCaseId = caseId;
            document.getElementById('cases-selector-view').style.display = 'none';
            document.getElementById('cases-arena-view').style.display = 'flex';
            let cData = CASES[caseId];
            document.getElementById('arena-title').innerText = cData.name;
            changeMultiCount(1);
            let lootRow = document.getElementById('case-loot-items-row');
            lootRow.innerHTML = '';
            cData.items.forEach(itemId => {
                let item = NFT_ITEMS[itemId];
                if(item) {
                    let node = document.createElement('div');
                    node.className = `loot-mini-node r-${item.rarity}`;
                    node.innerHTML = `<img src="${item.img}"><div>${item.price.toFixed(2)} TON</div>`;
                    lootRow.appendChild(node);
                }
            });
        }

        function closeArenaView() {
            document.getElementById('cases-selector-view').style.display = 'grid';
            document.getElementById('cases-arena-view').style.display = 'none';
        }

        function changeMultiCount(count) {
            multiCount = count;
            document.querySelectorAll('#m-count-1, #m-count-2, #m-count-4').forEach(b => b.classList.remove('active'));
            document.getElementById(`m-count-${count}`).classList.add('active');
            let cost = CASES[activeCaseId].price * count;
            document.getElementById('case-action-cost').innerText = cost.toFixed(2);
            let holder = document.getElementById('canvas-holders-container');
            holder.className = `multi-canvas-grid grid-${count}`;
            holder.innerHTML = '';
            for(let i=0; i<count; i++) {
                let rCont = document.createElement('div');
                rCont.className = 'roulette-container';
                rCont.id = `r-container-${i}`;
                rCont.innerHTML = `<div class="roulette-center-line"></div><div class="roulette-track" id="r-track-${i}"></div>`;
                holder.appendChild(rCont);
                populateRouletteTrack(i);
            }
        }

        function populateRouletteTrack(trackIdx) {
            let track = document.getElementById(`r-track-${trackIdx}`);
            if(!track) return;
            track.innerHTML = '';
            let caseItems = CASES[activeCaseId].items;
            for(let i=0; i<45; i++) {
                let randId = caseItems[Math.floor(Math.random() * caseItems.length)];
                let item = NFT_ITEMS[randId];
                let node = document.createElement('div');
                node.className = 'roulette-item';
                node.innerHTML = `<img src="${item.img}"><span>${item.name}</span><span class="item-cost">${item.price.toFixed(2)}</span>`;
                node.dataset.itemId = randId;
                track.appendChild(node);
            }
        }

        function triggerCaseOpening() {
            let totalCost = CASES[activeCaseId].price * multiCount;
            if(balance < totalCost) { alert("Недостаточно баланса!"); return; }
            balance -= totalCost;
            saveState();
            document.getElementById('btn-trigger-case').classList.add('disabled');
            let results = [];
            let spinDuration = 4000;
            for(let i=0; i<multiCount; i++) {
                let track = document.getElementById(`r-track-${i}`);
                let caseItems = CASES[activeCaseId].items;
                let wonItemId = caseItems[Math.floor(Math.random() * caseItems.length)];
                results.push(NFT_ITEMS[wonItemId]);
                let targetNodeIdx = 38; 
                let targetNode = track.children[targetNodeIdx];
                let item = NFT_ITEMS[wonItemId];
                targetNode.innerHTML = `<img src="${item.img}"><span>${item.name}</span><span class="item-cost">${item.price.toFixed(2)}</span>`;
                targetNode.dataset.itemId = wonItemId;
                let itemWidth = 96; 
                let containerWidth = document.getElementById(`r-container-${i}`).offsetWidth;
                let finalX = (targetNodeIdx * itemWidth) - (containerWidth / 2) + (itemWidth / 2) + (Math.random() * 20 - 10);
                track.style.transition = `transform ${spinDuration}ms cubic-bezier(0.1, 0.45, 0.1, 1)`;
                track.style.transform = `translateX(-${finalX}px)`;
            }
            setTimeout(() => {
                results.forEach(res => inventory.push(res.id));
                saveState();
                triggerWinModalNode(results.map(x => ({ ...x, status: "Выпало из кейса" })));
                document.getElementById('btn-trigger-case').classList.remove('disabled');
                changeMultiCount(multiCount);
            }, spinDuration + 400); 
        }

        /* ================= СУМКА И КАССА ================= */
        function switchSubInv(mode) {
            document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
            if(mode === 'items') {
                document.getElementById('sub-btn-items').classList.add('active');
                document.getElementById('sub-screen-items').style.display = 'grid';
                document.getElementById('sub-screen-history').style.display = 'none';
                renderInventoryItems();
            } else {
                document.getElementById('sub-btn-history').classList.add('active');
                document.getElementById('sub-screen-items').style.display = 'none';
                document.getElementById('sub-screen-history').style.display = 'flex';
                renderHistoryLogs();
            }
        }

        function renderInventoryItems() {
            const root = document.getElementById('sub-screen-items');
            root.innerHTML = '';
            if(inventory.length === 0) {
                root.innerHTML = '<p style="text-align:center; font-size:11px; color:var(--text-muted); padding-top:40px;">Твоя сумка пуста</p>';
                return;
            }
            inventory.forEach((itemId, idx) => {
                let item = NFT_ITEMS[itemId];
                if(!item) return;
                let card = document.createElement('div');
                card.className = `inv-card r-${item.rarity}`;
                card.innerHTML = `<img src="${item.img}"><div class="inv-details"><h5>${item.name}</h5><span class="price">${item.price.toFixed(2)} TON</span></div><div class="inv-actions-holder"><button class="action-sub-btn" onclick="sellItemImmediate(${idx})">Продать</button><button class="action-sub-btn btn-withdraw" onclick="requestItemWithdrawal(${idx})">Вывести</button></div>`;
                root.appendChild(card);
            });
        }

        function renderHistoryLogs() {
            const root = document.getElementById('sub-screen-history');
            root.innerHTML = '';
            if(historyLogs.length === 0) {
                root.innerHTML = '<p style="text-align:center; font-size:11px; color:var(--text-muted); padding-top:40px;">История пуста</p>';
                return;
            }
            historyLogs.forEach(log => {
                let node = document.createElement('div');
                node.className = 'history-item';
                node.innerHTML = `<span>${log.name}</span><span style="color:var(--neon-gold); font-weight:bold;">${log.status}</span>`;
                root.appendChild(node);
            });
        }

        function sellItemImmediate(idx) {
            let item = NFT_ITEMS[inventory[idx]];
            if(!item) return;
            balance += item.price;
            inventory.splice(idx, 1);
            saveState();
            renderInventoryItems();
        }

        function requestItemWithdrawal(idx) {
            let item = NFT_ITEMS[inventory[idx]];
            if(!item) return;
            let payload = { action: "withdraw_gift_request", item_name: item.name, item_id: item.id.toString(), price: item.price.toString() };
            if(tg) {
                tg.sendData(JSON.stringify(payload));
                historyLogs.push({ name: item.name, status: "В обработке" });
                inventory.splice(idx, 1);
                saveState();
                renderInventoryItems();
            } else {
                alert("Ошибка: Доступно только внутри Telegram!");
            }
        }

        // Изменение через ПОЛЗУНОК
        function updateDepositSliderValue() {
            let val = parseFloat(document.getElementById('cash-range-slider').value);
            document.getElementById('deposit-amount-lbl').innerText = val.toFixed(1);
            document.getElementById('cash-text-input').value = val.toFixed(1);
            
            recalculateStarsPrice(val);
        }

        // Изменение через ТЕКСТОВОЕ ПОЛЕ
        function updateDepositInputValue() {
            let inputField = document.getElementById('cash-text-input');
            let val = parseFloat(inputField.value);
            
            if (isNaN(val) || val <= 0) {
                val = 0.1; // Страховка от пустых полей или нулей
            }

            document.getElementById('deposit-amount-lbl').innerText = val.toFixed(1);
            
            // Если сумма в пределах ползунка, сдвигаем его. Если больше — выставляем ползунок на максимум
            let slider = document.getElementById('cash-range-slider');
            if(val <= parseFloat(slider.max)) {
                slider.value = val;
            } else {
                slider.value = slider.max;
            }

            recalculateStarsPrice(val);
        }

        // Рассчет стоимости Telegram Stars (1 TON ~ 15 Stars)
        function recalculateStarsPrice(tonValue) {
            let starsCalc = Math.ceil(tonValue * 15);
            document.getElementById('stars-cost-calculated').innerText = starsCalc;
        }

        function switchPayMethod(mode) {
            chosenCurrencyMode = mode;
            document.querySelectorAll('.curr-select-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'XTR') {
                document.getElementById('pay-method-stars').classList.add('active');
            } else {
                document.getElementById('pay-method-ton').classList.add('active');
            }
        }

        function sendDepositInvoiceToBot() {
            let val = parseFloat(document.getElementById('cash-text-input').value);
            if (isNaN(val) || val < 0.1) { alert("Минимальная сумма пополнения 0.1 TON"); return; }
            
            let payload = { action: "deposit_request", amount: val, currency: chosenCurrencyMode };
            if(tg) {
                tg.sendData(JSON.stringify(payload));
            } else {
                alert(`Тест вне ТГ. Запрос: ${val.toFixed(1)} TON через ${chosenCurrencyMode}`);
            }
        }

        /* ================= МОДАЛКИ И АДМИНКА ================= */
        function triggerWinModalNode(nodesArray) {
            let modal = document.getElementById('global-win-modal');
            let holder = document.getElementById('win-modal-nodes-holder');
            holder.innerHTML = '';
            nodesArray.forEach(n => {
                let row = document.createElement('div');
                row.className = 'win-action-row';
                row.innerHTML = `<img src="${n.img}"><div class="win-action-info"><h6>${n.name}</h6><span>${n.price.toFixed(2)} TON</span><div style="font-size:9px; color:#aaa; margin-top:2px;">${n.status}</div></div>`;
                holder.appendChild(row);
            });
            modal.style.display = 'flex';
        }

        function closeWinModal() {
            document.getElementById('global-win-modal').style.display = 'none';
        }

        function dbInspectUserAccount() {
            let targetId = document.getElementById('db-target-tgid').value.trim();
            if(!targetId) { alert("Введите Telegram ID!"); return; }
            let tBalance = localStorage.getItem(`balance_${targetId}`) !== null ? parseFloat(localStorage.getItem(`balance_${targetId}`)) : 0.0;
            let tInv = localStorage.getItem(`inventory_${targetId}`) !== null ? JSON.parse(localStorage.getItem(`inventory_${targetId}`)) : [];
            document.getElementById('db-insp-status').innerText = `Профиль загружен (ID: ${targetId})`;
            document.getElementById('db-insp-balance').innerText = `${tBalance.toFixed(2)} TON`;
            let chipsHolder = document.getElementById('db-insp-inventory-chips');
            chipsHolder.innerHTML = '';
            if(tInv.length === 0) {
                chipsHolder.innerHTML = '<span style="color:#666;">Сумка пуста</span>';
            } else {
                tInv.forEach(itemId => {
                    let item = NFT_ITEMS[itemId];
                    if(item) {
                        let chip = document.createElement('span');
                        chip.className = 'db-chip';
                        chip.innerText = item.name;
                        chipsHolder.appendChild(chip);
                    }
                });
            }
        }

        function dbModifyBalance(offset) {
            let targetId = document.getElementById('db-target-tgid').value.trim();
            if(!targetId) { alert("Сначала введи Telegram ID игрока!"); return; }
            let tBalance = localStorage.getItem(`balance_${targetId}`) !== null ? parseFloat(localStorage.getItem(`balance_${targetId}`)) : 0.0;
            tBalance += offset;
            if(tBalance < 0) tBalance = 0;
            localStorage.setItem(`balance_${targetId}`, tBalance);
            if(targetId == userId) { balance = tBalance; saveState(); }
            dbInspectUserAccount();
        }

        function dbInjectNftToUser() {
            let targetId = document.getElementById('db-target-tgid').value.trim();
            if(!targetId) { alert("Сначала введи Telegram ID игрока!"); return; }
            let nftId = parseInt(document.getElementById('db-admin-nft-selector').value);
            let targetInventoryRaw = localStorage.getItem(`inventory_${targetId}`) !== null ? JSON.parse(localStorage.getItem(`inventory_${targetId}`)) : [];
            targetInventoryRaw.push(nftId);
            localStorage.setItem(`inventory_${targetId}`, JSON.stringify(targetInventoryRaw));
            if(targetId == userId) { inventory = targetInventoryRaw; saveState(); }
            dbInspectUserAccount();
            alert(`Предмет успешно выдан игроку ${targetId}!`);
        }

        function dbWipeUserInventory() {
            let targetId = document.getElementById('db-target-tgid').value.trim();
            if(!targetId) { alert("Сначала введи Telegram ID игрока!"); return; }
            if(confirm(`Ты уверен, что хочешь ПОЛНОСТЬЮ очистить инвентарь игрока ${targetId}?`)) {
                localStorage.setItem(`inventory_${targetId}`, JSON.stringify([]));
                if(targetId == userId) { inventory = []; saveState(); }
                dbInspectUserAccount();
                alert(`Инвентарь игрока ${targetId} полностью очищен!`);
            }
        }

        window.onload = () => {
            saveState();
            updateDepositSliderValue();
            checkAdminAccess(); 
            if(NFT_ITEMS[selectedSiteTargetId]) document.getElementById('ring-target-preview').src = NFT_ITEMS[selectedSiteTargetId].img;
        };
    </script>
</body>
</html>

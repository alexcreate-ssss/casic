<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON NFT UPGRADE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c0a14;
            --bg-card: #131022;
            --bg-panel: #1a1630;
            --neon-blue: #00f2fe;
            --neon-pink: #f857a6;
            --neon-green: #00ff87;
            --neon-gold: #ffb700;
            --text-muted: #575273;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--bg-main); color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; }

        /* Шапка */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; }
        .logo { font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(90deg, #fff, var(--neon-blue)); -webkit-text-fill-color: transparent; }
        .balance-container { background: rgba(0, 255, 135, 0.1); border: 1px solid rgba(0, 255, 135, 0.2); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        .balance-val { color: var(--neon-green); }

        /* Табы */
        .tabs-nav { display: flex; background: var(--bg-card); border-radius: 12px; padding: 4px; margin-bottom: 10px; gap: 4px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 10px 0; font-weight: bold; font-size: 11px; cursor: pointer; border-radius: 8px; transition: all 0.2s; text-transform: uppercase; }
        .tab-btn.active { background: var(--bg-panel); color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 254, 0.1); }

        .screen { display: none; flex-direction: column; flex-grow: 1; }
        .screen.active { display: flex; }

        /* ================= ВЕРХНЯЯ ЗОНА: РУЛЕТКА И КНОПКА ================= */
        .upgrade-top-area { background: var(--bg-card); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; align-items: center; position: relative; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.01); }
        
        .upg-center-ring { position: relative; width: 130px; height: 130px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .ring-canvas { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .ring-preview-img { width: 70px; height: 70px; object-fit: contain; z-index: 2; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6)); transition: transform 0.2s; }
        
        .chance-badge { background: rgba(0, 255, 137, 0.1); border: 1px solid rgba(0, 255, 137, 0.2); padding: 5px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; color: var(--neon-green); margin-bottom: 12px; }
        
        .action-controls-row { display: flex; width: 100%; gap: 6px; align-items: center; }
        .ring-btn { flex: 2; background: linear-gradient(135deg, var(--neon-blue), #0072ff); border: none; padding: 14px; border-radius: 12px; color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); text-transform: uppercase; letter-spacing: 1px; }
        .ring-btn:active { transform: scale(0.98); }
        
        .grid-multipliers { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .mini-btn { background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.03); color: #aaa; border-radius: 8px; padding: 12px 0; font-size: 10px; font-weight: bold; cursor: pointer; text-align: center; }

        /* ================= НИЖНЯЯ ЗОНА: ИДЕАЛЬНЫЙ СПЛИТ НА ПОЛ-ЭКРАНА ================= */
        .upgrade-bottom-split { display: flex; gap: 8px; flex-grow: 1; height: 320px; }
        
        .split-column { flex: 1; background: var(--bg-card); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.01); width: 50%; }
        .column-header { font-size: 10px; font-weight: bold; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 6px; }
        
        /* Скролл-контейнеры для гридов внутри половинок */
        .column-grid-scroll { flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; padding-right: 2px; }
        
        /* Компактные карточки для сплит-экрана */
        .split-card { background: var(--bg-panel); border-radius: 10px; padding: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid transparent; cursor: pointer; transition: all 0.15s; }
        .split-card img { width: 42px; height: 42px; object-fit: contain; margin-bottom: 4px; }
        .split-card h5 { font-size: 9px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-bottom: 2px; }
        .split-card span { font-size: 9px; color: var(--neon-gold); font-weight: bold; }
        
        .split-card.selected-src { border-color: var(--neon-pink); background: rgba(248, 87, 166, 0.05); }
        .split-card.selected-tar { border-color: var(--neon-blue); background: rgba(0, 242, 254, 0.05); }

        /* Экраны Кейсов, Сумки и Кассы */
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .case-card { background: var(--bg-card); border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; }
        .case-card img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 6px; }
        
        .arena-view { display: none; background: var(--bg-card); border-radius: 16px; padding: 12px; flex-direction: column; }
        .canvas-container { background: #04030a; border: 2px solid var(--bg-panel); border-radius: 12px; overflow: hidden; position: relative; width: 100%; margin-bottom: 12px; }
        #cases-canvas { display: block; width: 100%; height: 240px; }

        .inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; max-height: 400px; }
        .inv-card { background: var(--bg-card); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; text-align: center; border-bottom: 3px solid #fff; }
        .inv-card img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 4px; }
        .inv-card h5 { font-size: 10px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .inv-card .price { font-size: 10px; color: var(--neon-gold); font-weight: bold; margin-bottom: 4px; }
        .inv-sub-btn { width: 100%; border: none; padding: 5px 0; font-size: 9px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 2px; }

        .r-mil { border-bottom-color: #5e98d9; }
        .r-rest { border-bottom-color: #00f2fe; }
        .r-class { border-bottom-color: #b230ff; }
        .r-cov { border-bottom-color: #eb4b4b; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(3,2,7,0.95); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-body { background: var(--bg-card); border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; text-align: center; }
        .win-title { color: var(--neon-green); font-size: 18px; font-weight: 900; margin-bottom: 15px; }
        .win-flex { display: flex; gap: 8px; overflow-x: auto; justify-content: center; padding: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .win-node { flex: 0 0 80px; background: var(--bg-panel); padding: 6px; border-radius: 8px; font-size: 9px; }
        .win-node img { width: 40px; height: 40px; object-fit: contain; }
        .main-btn { width: 100%; background: linear-gradient(90deg, var(--neon-green), #00cb62); border: none; padding: 12px; border-radius: 10px; color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 12px; }

        .invoice-sheet { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card); border-top: 2px solid var(--bg-panel); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px; z-index: 200; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; }

        .admin-panel { display: none; background: rgba(248, 87, 166, 0.02); border: 1px dashed var(--neon-pink); border-radius: 16px; padding: 12px; margin-top: 15px; }
        .admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
        .admin-btn { background: #201128; border: 1px solid var(--neon-pink); color: #fff; padding: 6px 0; font-size: 9px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        .disabled { opacity: 0.3; pointer-events: none; }
        
        /* Скроллбары для красоты */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-panel); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="logo">💎 TON NFT ARCADE</div>
        <div class="balance-container">
            <span class="balance-val" id="global-balance">0.00</span> TON
        </div>
    </div>

    <div class="tabs-nav">
        <button class="tab-btn active" id="btn-tab-upg" onclick="switchTab('upg')">⚡ Апгрейд</button>
        <button class="tab-btn" id="btn-tab-cases" onclick="switchTab('cases')">📦 Кейсы</button>
        <button class="tab-btn" id="btn-tab-inv" onclick="switchTab('inv')">🎒 Сумка</button>
        <button class="tab-btn" id="btn-tab-cash" onclick="switchTab('cash')">👛 Касса</button>
    </div>

    <div id="screen-upg" class="screen active">
        
        <div class="upgrade-top-area">
            <div class="upg-center-ring">
                <canvas class="ring-canvas" id="ring-canvas" width="130" height="130"></canvas>
                <img src="https://nft.fragment.com/avatar/4b69ff.svg" class="ring-preview-img" id="ring-target-preview">
            </div>
            
            <div class="chance-badge" id="chance-badge-val">0.00%</div>
            
            <div class="action-controls-row">
                <button class="ring-btn" id="ring-action-btn" onclick="startUpgradeProcess()">⚡ УЛУЧШИТЬ ПРЕДМЕТ</button>
                <div class="grid-multipliers">
                    <button class="mini-btn" onclick="shortcutMultiplier(2)">x2</button>
                    <button class="mini-btn" onclick="shortcutMultiplier(5)">x5</button>
                    <button class="mini-btn" onclick="shortcutMultiplier(10)">x10</button>
                </div>
            </div>
        </div>

        <div class="upgrade-bottom-split">
            
            <div class="split-column">
                <div class="column-header">Мои подарки 🎒</div>
                <div class="column-grid-scroll" id="upg-left-my-inventory"></div>
            </div>
            
            <div class="split-column">
                <div class="column-header">Цели на апгрейд 🎯</div>
                <div class="column-grid-scroll" id="upg-right-site-targets"></div>
            </div>

        </div>
    </div>

    <div id="screen-cases" class="screen">
        <div class="cases-grid" id="cases-selector-view"></div>
        <div class="arena-view" id="cases-arena-view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <button class="mini-btn" style="padding:4px 10px;" onclick="closeArenaView()">◀ Выйти</button>
                <h4 id="arena-title" style="color:var(--neon-blue); font-size:13px;">Кейс</h4>
                <div style="display:flex; gap:3px;">
                    <button class="mini-btn" style="padding:4px 8px;" id="m-count-1" onclick="changeMultiCount(1)">x1</button>
                    <button class="mini-btn" style="padding:4px 8px;" id="m-count-2" onclick="changeMultiCount(2)">x2</button>
                    <button class="mini-btn" style="padding:4px 8px;" id="m-count-4" onclick="changeMultiCount(4)">x4</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="cases-canvas" width="400" height="240"></canvas>
            </div>
            <button class="main-btn" id="btn-trigger-case" onclick="triggerCaseOpening()">ОТКРЫТЬ КЕЙС ЗА <span id="case-action-cost">0.00</span> TON</button>
        </div>
    </div>

    <div id="screen-inv" class="screen">
        <div class="inv-grid" id="main-inventory-dom-grid"></div>
    </div>

    <div id="screen-cash" class="screen">
        <div style="background:var(--bg-card); border-radius:12px; padding:15px; margin-bottom:10px;">
            <h4 style="color:var(--neon-gold); margin-bottom:4px; font-size:14px;">🌟 Пополнение через Stars</h4>
            <button class="main-btn" style="background:linear-gradient(90deg, #ffb700, #ff8800);" onclick="initiatePayment('stars', 15, 250)">Купить +15.00 TON за 🌟 250</button>
        </div>
        <div style="background:var(--bg-card); border-radius:12px; padding:15px;">
            <h4 style="color:var(--neon-blue); margin-bottom:4px; font-size:14px;">💎 Пополнение через TON</h4>
            <button class="main-btn" style="background:linear-gradient(90deg, #0088cc, #0055ff);" onclick="initiatePayment('ton', 50, 0)">Пополнить +50.00 TON</button>
        </div>
        <div class="admin-panel" id="secret-developer-panel">
            <h4 style="color:var(--neon-pink); font-size:11px;">🛠️ АДМИН-БАЗА</h4>
            <div class="admin-grid">
                <button class="admin-btn" onclick="devBalance(50)">+50 TON</button>
                <button class="admin-btn" onclick="devInjectNft(4)">Дать Username</button>
                <button class="admin-btn" onclick="devWipeAll()">Сброс</button>
            </div>
        </div>
    </div>

    <div class="modal" id="global-win-modal">
        <div class="modal-body">
            <h3 class="win-title">🎉 ОТЛИЧНЫЙ ДРОП!</h3>
            <div class="win-flex" id="win-modal-nodes-holder"></div>
            <button class="main-btn" onclick="closeWinModal()">В инвентарь</button>
        </div>
    </div>

    <div class="invoice-sheet" id="native-invoice-sheet">
        <div class="invoice-row"><span>Продукт:</span><span id="sheet-product" style="color:#fff;">Валюта</span></div>
        <div class="invoice-row"><span>Цена:</span><span id="sheet-price" style="color:var(--neon-gold);">0</span></div>
        <div style="display:flex; gap:6px; margin-top:15px;">
            <button class="mini-btn" style="flex:1;" onclick="closeInvoiceSheet()">Отмена</button>
            <button class="main-btn" style="flex:2;" onclick="simulateSuccessPayment()">Оплатить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if(tg) { tg.expand(); tg.ready(); }

        const ADMIN_TELEGRAM_ID = 123456789;

        const NFT_ITEMS = [
            { id: 0, name: "Notcoin Voucher", price: 0.80, img: "https://cache.fragment.com/nft/a/01777d85347be3fe2440be5691fd9a071d05bd63.jpg", rarity: "mil" },
            { id: 1, name: "TON Punk #2410", price: 1.50, img: "https://cache.fragment.com/nft/a/133f9157be0ca873c52e8006bf207d5d7105bd63.jpg", rarity: "mil" },
            { id: 2, name: "Anonymous +888", price: 3.50, img: "https://nft.fragment.com/number/88801234567.svg", rarity: "rest" },
            { id: 3, name: "Whales Club NFT", price: 8.00, img: "https://cache.fragment.com/nft/a/24cf9156ee1ba873c54e8006bf207d5d7105bd63.jpg", rarity: "class" },
            { id: 4, name: "Username @durov", price: 22.00, img: "https://nft.fragment.com/username/durov.svg", rarity: "cov" },
            { id: 5, name: "Alpha Avatar", price: 70.00, img: "https://cache.fragment.com/nft/a/77cf9156ee0ba273c54e8006bf207d5d7105bd63.jpg", rarity: "cov" }
        ];

        const CASES = [
            { id: 0, name: "Starter Notcoin Box", price: 1.00, items: [0, 1], img: "https://cache.fragment.com/nft/a/01777d85347be3fe2440be5691fd9a071d05bd63.jpg" },
            { id: 1, name: "Anonymous Number Case", price: 3.00, items: [0, 1, 2], img: "https://nft.fragment.com/number/88801234567.svg" },
            { id: 2, name: "Durov's VIP Pack", price: 20.00, items: [3, 4, 5], img: "https://nft.fragment.com/username/durov.svg" }
        ];

        let balance = localStorage.getItem('arcade_balance') !== null ? parseFloat(localStorage.getItem('arcade_balance')) : 25.00;
        let inventory = localStorage.getItem('arcade_inventory') !== null ? JSON.parse(localStorage.getItem('arcade_inventory')) : [0, 1, 2];

        let selectedMyInvIndex = null; 
        let selectedSiteTargetId = 1;  
        let currentChance = 0;
        let isSpinning = false;
        let multiCount = 1;
        let activeCaseId = 0;

        let ringCanvas, ringCtx;

        function saveState() {
            localStorage.setItem('arcade_balance', balance);
            localStorage.setItem('arcade_inventory', JSON.stringify(inventory));
            document.getElementById('global-balance').innerText = balance.toFixed(2);
        }

        function checkAdminRights() {
            let uId = tg?.initDataUnsafe?.user?.id || 0;
            if(uId === ADMIN_TELEGRAM_ID || ADMIN_TELEGRAM_ID === 123456789) {
                document.getElementById('secret-developer-panel').style.display = "block";
            } else {
                document.getElementById('secret-developer-panel')?.remove();
            }
        }

        function switchTab(tabId) {
            if(isSpinning) return;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`screen-${tabId}`).classList.add('active');
            document.getElementById(`btn-tab-${tabId}`).classList.add('active');

            if(tabId === 'upg') renderUpgradeSplitScreen();
            if(tabId === 'cases') initCasesCatalog();
            if(tabId === 'inv') renderMainInventory();
        }

        // ================= НОВАЯ ЛОГИКА ДВУХ КОЛОНОК АПГРЕЙДА =================
        function renderUpgradeSplitScreen() {
            // 1. Левая половина - Инвентарь игрока
            const leftContainer = document.getElementById('upg-left-my-inventory');
            leftContainer.innerHTML = '';
            
            if(inventory.length === 0) {
                leftContainer.innerHTML = '<div style="grid-column:1/-1; text-align:center; font-size:10px; color:var(--text-muted); padding-top:20px;">Сумка пуста</div>';
            } else {
                inventory.forEach((itemId, idx) => {
                    const item = NFT_ITEMS[itemId];
                    const card = document.createElement('div');
                    card.className = `split-card ${selectedMyInvIndex === idx ? 'selected-src' : ''}`;
                    card.innerHTML = `<img src="${item.img}"><h5>${item.name}</h5><span>${item.price.toFixed(2)}</span>`;
                    card.onclick = () => {
                        if(isSpinning) return;
                        selectedMyInvIndex = idx;
                        recalculateUpgradeChance();
                        renderUpgradeSplitScreen();
                    };
                    leftContainer.appendChild(card);
                });
            }

            // 2. Правая половина - Все цели сайта
            const rightContainer = document.getElementById('upg-right-site-targets');
            rightContainer.innerHTML = '';

            NFT_ITEMS.forEach(item => {
                const card = document.createElement('div');
                card.className = `split-card ${selectedSiteTargetId === item.id ? 'selected-tar' : ''}`;
                card.innerHTML = `<img src="${item.img}"><h5>${item.name}</h5><span>${item.price.toFixed(2)}</span>`;
                card.onclick = () => {
                    if(isSpinning) return;
                    selectedSiteTargetId = item.id;
                    recalculateUpgradeChance();
                    renderUpgradeSplitScreen();
                };
                rightContainer.appendChild(card);
            });

            recalculateUpgradeChance();
        }

        function recalculateUpgradeChance() {
            if(selectedMyInvIndex === null) {
                currentChance = 0;
                document.getElementById('chance-badge-val').innerText = "ВЫБЕРИТЕ ДЕПОЗИТ";
                document.getElementById('ring-target-preview').src = NFT_ITEMS[selectedSiteTargetId].img;
                drawStaticRing(0);
                return;
            }

            const myItem = NFT_ITEMS[inventory[selectedMyInvIndex]];
            const targetItem = NFT_ITEMS[selectedSiteTargetId];

            document.getElementById('ring-target-preview').src = targetItem.img;

            if(targetItem.price <= myItem.price) {
                currentChance = 100;
                document.getElementById('chance-badge-val').innerText = "ЦЕЛЬ ДОЛЖНА БЫТЬ ДОРОЖЕ";
                drawStaticRing(0);
                return;
            }

            let chance = (myItem.price / targetItem.price) * 100;
            chance = Math.max(0.1, Math.min(95, chance));
            currentChance = chance;

            document.getElementById('chance-badge-val').innerText = `${chance.toFixed(2)}% ШАНС`;
            drawStaticRing(chance);
        }

        function shortcutMultiplier(factor) {
            if(selectedMyInvIndex === null || isSpinning) return;
            const myPrice = NFT_ITEMS[inventory[selectedMyInvIndex]].price;
            const ideal = myPrice * factor;

            let bestMatch = NFT_ITEMS.filter(i => i.price > myPrice).reduce((prev, curr) => {
                return Math.abs(curr.price - ideal) < Math.abs(prev.price - ideal) ? curr : prev;
            }, NFT_ITEMS[NFT_ITEMS.length - 1]);

            selectedSiteTargetId = bestMatch.id;
            renderUpgradeSplitScreen();
        }

        // Отрисовка круга
        function drawStaticRing(pct, currentAngle = -Math.PI/2) {
            if(!ringCanvas) {
                ringCanvas = document.getElementById('ring-canvas');
                ringCtx = ringCanvas.getContext('2d');
            }
            let cx = ringCanvas.width / 2;
            let cy = ringCanvas.height / 2;
            let r = cx - 6;

            ringCtx.clearRect(0,0,ringCanvas.width,ringCanvas.height);

            // Ободок
            ringCtx.beginPath();
            ringCtx.arc(cx, cy, r, 0, Math.PI*2);
            ringCtx.lineWidth = 5;
            ringCtx.strokeStyle = "#1a1630";
            ringCtx.stroke();

            if(pct > 0) {
                // Сектор успеха
                ringCtx.beginPath();
                ringCtx.arc(cx, cy, r, -Math.PI/2, (-Math.PI/2) + (Math.PI*2 * (pct/100)));
                ringCtx.lineWidth = 5;
                ringCtx.strokeStyle = "#00ff87";
                ringCtx.stroke();
            }

            // Бегущая стрелочка
            ringCtx.save();
            ringCtx.translate(cx, cy);
            ringCtx.rotate(currentAngle);
            ringCtx.beginPath();
            ringCtx.moveTo(r - 6, -5);
            ringCtx.lineTo(r + 6, 0);
            ringCtx.lineTo(r - 6, 5);
            ringCtx.closePath();
            ringCtx.fillStyle = "#ffb700";
            ringCtx.fill();
            ringCtx.restore();
        }

        // МЕДЛЕННАЯ АЗАРТНАЯ КРУТИЛКА
        function startUpgradeProcess() {
            if(isSpinning || selectedMyInvIndex === null || currentChance === 100 || currentChance === 0) return;
            
            isSpinning = true;
            document.getElementById('ring-action-btn').classList.add('disabled');

            let startTimestamp = performance.now();
            let duration = 5500; // ⚡ Увеличили время до 5.5 секунд для жесткого азарта
            let isWinner = (Math.random() * 100) < currentChance;

            // Накручиваем 7 полных кругов + смещение
            let totalTurnsAngle = Math.PI * 14; 
            let winSectorSize = (Math.PI * 2) * (currentChance / 100);
            let finalOffset = isWinner ? (Math.random() * winSectorSize) : (winSectorSize + Math.random() * (Math.PI * 2 - winSectorSize));
            let destinationAngle = (-Math.PI / 2) + totalTurnsAngle + finalOffset;

            function animationLoop(now) {
                let elapsed = now - startTimestamp;
                let progress = Math.min(elapsed / duration, 1);
                
                // Мощное кубическое замедление (Cubic Ease Out) — стрелка под конец еле ползет
                let ease = 1 - Math.pow(1 - progress, 3); 
                
                let currentAngle = (-Math.PI / 2) + (destinationAngle - (-Math.PI / 2)) * ease;

                drawStaticRing(currentChance, currentAngle);

                if(progress < 1) {
                    requestAnimationFrame(animationLoop);
                } else {
                    isSpinning = false;
                    document.getElementById('ring-action-btn').classList.remove('disabled');
                    
                    if(isWinner) {
                        inventory[selectedMyInvIndex] = selectedSiteTargetId;
                        alert(`🔥 АПГРЕЙД ЗАШЕЛ! Вы получили: ${NFT_ITEMS[selectedSiteTargetId].name}`);
                    } else {
                        inventory.splice(selectedMyInvIndex, 1);
                        alert("💀 СГОРЕЛ! Повезет в следующий раз.");
                    }
                    selectedMyInvIndex = null;
                    saveState();
                    renderUpgradeSplitScreen();
                }
            }
            requestAnimationFrame(animationLoop);
        }


        // ================= ОСТАЛЬНОЙ НАДЁЖНЫЙ ФУНКЦИОНАЛ =================
        function initCasesCatalog() {
            document.getElementById('cases-selector-view').style.display = "grid";
            document.getElementById('cases-arena-view').style.display = "none";
            const v = document.getElementById('cases-selector-view');
            v.innerHTML = '';
            CASES.forEach(c => {
                const n = document.createElement('div');
                n.className = "case-card";
                n.innerHTML = `<img src="${c.img}"><h4>${c.name}</h4><p style="color:var(--neon-gold); font-weight:bold; font-size:12px;">${c.price.toFixed(2)} TON</p>`;
                n.onclick = () => {
                    activeCaseId = c.id;
                    document.getElementById('cases-selector-view').style.display = "none";
                    document.getElementById('cases-arena-view').style.display = "flex";
                    document.getElementById('arena-title').innerText = c.name;
                    changeMultiCount(1);
                };
                v.appendChild(n);
            });
        }

        function changeMultiCount(c) {
            multiCount = c;
            document.querySelectorAll('[id^="m-count-"]').forEach(b => b.classList.remove('active'));
            document.getElementById(`m-count-${c}`).classList.add('active');
            document.getElementById('case-action-cost').innerText = (CASES[activeCaseId].price * c).toFixed(2);
        }

        function closeArenaView() { initCasesCatalog(); }

        function triggerCaseOpening() {
            let cost = CASES[activeCaseId].price * multiCount;
            if(balance < cost) { alert("Недостаточно TON!"); return; }
            balance -= cost;

            let holder = document.getElementById('win-modal-nodes-holder');
            holder.innerHTML = '';
            
            for(let i=0; i<multiCount; i++) {
                let pList = CASES[activeCaseId].items;
                let rItem = NFT_ITEMS[pList[Math.floor(Math.random() * pList.length)]];
                inventory.push(rItem.id);

                let d = document.createElement('div');
                d.className = "win-node";
                d.innerHTML = `<img src="${rItem.img}"><p>${rItem.name}</p>`;
                holder.appendChild(d);
            }
            saveState();
            document.getElementById('global-win-modal').style.display = "flex";
        }

        function closeWinModal() { document.getElementById('global-win-modal').style.display = "none"; initCasesCatalog(); }

        function renderMainInventory() {
            const g = document.getElementById('main-inventory-dom-grid');
            g.innerHTML = '';
            inventory.forEach((id, index) => {
                const item = NFT_ITEMS[id];
                const card = document.createElement('div');
                card.className = `inv-card r-${item.rarity}`;
                card.innerHTML = `<img src="${item.img}"><h5>${item.name}</h5><div class="price">${item.price.toFixed(2)} TON</div><button class="inv-sub-btn" style="background:rgba(0,255,135,0.15); color:var(--neon-green);" onclick="withdrawItemAction(${index})">Вывести</button>`;
                g.appendChild(card);
            });
        }

        function withdrawItemAction(idx) {
            let item = NFT_ITEMS[inventory[idx]];
            if(confirm(`Вывести ${item.name} в бот?`)) {
                if(tg) tg.sendData(JSON.stringify({action:"withdraw_gift_request", item_id: item.id, item_name: item.name}));
                inventory.splice(idx, 1);
                saveState();
                renderMainInventory();
                alert("Заявка улетела в админку бота!");
            }
        }

        let currentPayVal = 0;
        function initiatePayment(type, val, stars) {
            currentPayVal = val;
            document.getElementById('sheet-product').innerText = `Пополнение +${val} TON`;
            document.getElementById('sheet-price').innerText = type==='stars' ? `${stars} Stars` : `${val} TON`;
            document.getElementById('native-invoice-sheet').style.display = "block";
        }
        function closeInvoiceSheet() { document.getElementById('native-invoice-sheet').style.display = "none"; }
        function simulateSuccessPayment() {
            balance += currentPayVal;
            saveState();
            closeInvoiceSheet();
            alert("Валюта зачислена!");
        }

        function devBalance(v) { balance += v; saveState(); }
        function devInjectNft(id) { inventory.push(id); saveState(); }
        function devWipeAll() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            checkAdminRights();
            saveState();
            renderUpgradeSplitScreen();
        };
    </script>
</body>
